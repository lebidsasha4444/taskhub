{% extends "base.html" %}
{% block title %}Users · Taskhub{% endblock %}
{% block content %}
  <h1>Users</h1>
  <form method="post" action="{{ url_for('main.create_user') }}">
    <label for="username">Create a user</label>
    <input id="username" name="username" maxlength="80" required>
    <button type="submit">Create user</button>
  </form>

  <h2>All users</h2>
  {% if users %}
    <ul>
      {% for user in users %}
        <li><a href="{{ url_for('main.list_tasks', user_id=user.id) }}">{{ user.username }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="muted">No users yet.</p>
  {% endif %}
{% endblock %}
