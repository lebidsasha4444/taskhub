{% extends "base.html" %}
{% block title %}{{ task.title }} · Taskhub{% endblock %}
{% block content %}
  <h1>{{ task.title }}</h1>
  <p>{{ task.content }}</p>
  <p class="muted">Created {{ task.created_at.isoformat() }}</p>
  <p><a href="{{ url_for('main.list_tasks', user_id=task.user_id) }}">Back to tasks</a></p>
{% endblock %}
